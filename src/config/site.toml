[config.site]
title = "Wang Huiwen"
description = "Wang Huiwen – Computing & Finance at NTU"
pageTitle = "Wang Huiwen"
pageDescription = "Computing & Finance undergraduate at NTU focused on fundamental equity research, small-cap biotech, and building software and hardware systems."
url = "https://www.huiwen.fyi"
repository = "https://github.com/AlwaysTasty/astro-navfolio"
footerNote = "Original Template by dodolalorc"

[config.theme]
# 可用色盘：
# green-soft, green-vivid, rose-soft, pink-soft, purple-soft, blue-soft, orange-soft, brown-soft
palette = "blue-soft"
# 原生 UI 语言。可用值：en、zh-CN、zh-TW。未知值会回退到 en。
lang = "en"

[config.fonts]
# 英文与代码感 UI 字体
en = "Inter"
code = "Monaco"
# 模板内可直接选择：ChillRoundM、LXGW WenKai
# 中文阅读字体
zh = "ChillRoundM"
# 中文完整字体文件
file = "/fonts/ChillRoundM.ttf"

[config.code]
lightTheme = "catppuccin-latte"
darkTheme = "tokyo-night"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.math]
render = "katex" # "katex" | "mathjax"

[config.comments]
enabled = false
provider = "none"
show_on_posts = true

[config.search]
enabled = true
shortcut = "mod+k"
placeholder = "Search notes..."
maxResults = 6

[config.pages.blog]
title = "Writing notes"
kicker = "Notebook archive"
subtitle = "Notes from the margins."
note = "Field notes, drafts, and technical margins arranged for slow browsing."
postsPerPage = 6
# date-fns 使用的日期格式模板。
dateFormat = "yyyy-MM-dd"
# 元信息分隔符。可以使用 "|"、"/" 等符号，也可以使用特殊值 "icon"。
metadataSeparator = "icon"
# 文章列表封面样式："card" 保留带边框的缩略图，"mask" 会将图片融合到右侧。
coverImageStyle = "mask"

[config.pages.blog.categories]
title = "Categories"
kicker = "Browse notes"
subtitle = ""
note = "A quiet index of recurring topics, gathered from article frontmatter."

[config.pages.blog.series]
title = "Series"
kicker = "Reading paths"
subtitle = ""
note = "There's nothing here yet"

[config.pages.projects]
title = "Projects"
kicker = "Project shelf"
subtitle = "Things I've built and worked on"
note = "Software, hardware and finance projects."

[config.pages.vibe]
title = "vibe"
kicker = ""
subtitle = "IDK what's this for either"
note = "Please click on something else"
showTrail = true

[config.comments.giscus]
repo = ""
repo_id = ""
category = ""
category_id = ""
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
light_theme = "light"
dark_theme = "dark"
lang = "en"
loading = "lazy"

[config.comments.utterances]
repo = ""
issue_term = "pathname"
label = "comment"
theme = "github-light"

[config.comments.waline]
server_url = ""
lang = "en"
dark = "html.dark"
pageview = true
comment = true

